<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSO Glass Demo</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.31.0/mapbox-gl.css" rel="stylesheet">
<link rel="modulepreload" href="./vendor/liquidglass.js">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --w: 1920px;
    --h: 1080px;
    --white: #fff;
    --white-10: rgba(255, 255, 255, 0.1);
    --white-20: rgba(255, 255, 255, 0.2);
    --white-30: rgba(255, 255, 255, 0.3);
    --white-50: rgba(255, 255, 255, 0.5);
    --black-10: rgba(0, 0, 0, 0.1);
    --black-30: rgba(0, 0, 0, 0.3);
    --black-50: rgba(0, 0, 0, 0.5);
    --secondary: #f5f5f5;
    --secondary-fg: #171717;
    --ts-soft: 0 0 12px rgba(0, 0, 0, 0.15);
    --ts-drop: 0 4px 4px rgba(0, 0, 0, 0.25);
    --surface: linear-gradient(180deg, rgba(255, 255, 255, 0.056) 0%, rgba(217, 237, 245, 0.012) 42%, rgba(209, 235, 242, 0.032) 100%), linear-gradient(90deg, rgba(0, 0, 0, 0.12) 0%, rgba(0, 0, 0, 0.12) 100%);
    /* Glass tone: dark base (default) or light base. RGB triplet used as rgba(var(--glass-fill), alpha). */
    --glass-fill: 0, 0, 0;
    --surface-quiet: linear-gradient(180deg, rgba(255, 255, 255, 0.036) 0%, rgba(217, 237, 245, 0.008) 50%, rgba(209, 235, 242, 0.02) 100%), linear-gradient(90deg, rgba(var(--glass-fill), 0.15) 0%, rgba(var(--glass-fill), 0.15) 100%);
    --surface-active: linear-gradient(180deg, rgba(255, 255, 255, 0.056) 0%, rgba(217, 237, 245, 0.012) 42%, rgba(209, 235, 242, 0.032) 100%), linear-gradient(90deg, rgba(var(--glass-fill), 0.22) 0%, rgba(var(--glass-fill), 0.22) 100%);
    --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-inter: "Inter", ui-sans-serif, system-ui, sans-serif;
    --font-compass: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; }
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; overflow: hidden; }
  /* A fixed, clipped body keeps the 1920 or 430 px stage from widening the mobile layout viewport */
  body { position: fixed; inset: 0; width: 100%; height: 100%; }
  #safe-probe { position: fixed; top: 0; left: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  body {
    background: #050709;
    color: var(--white);
    font-family: var(--font);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  p { margin: 0; }
  img { display: block; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }
  template { display: none; }

  /* Mount points */
  canvas.glass-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #stage {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--w);
    height: var(--h);
    transform-origin: 0 0;
  }
  #stage > .panel { position: absolute; }
  /* Glass mode: the canvas draws a copy of the UI; this invisible DOM copy on top takes all input */
  body.glass #stage { z-index: 1; opacity: 0; }
  body.glass canvas.glass-canvas { pointer-events: none; }
  body.glass #stage .panel { background: none; }

  /* Backdrop */
  .backdrop { position: relative; width: var(--w); height: var(--h); overflow: hidden; background: #050709; }
  .backdrop .render {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform-origin: 50% 50%;
    transition: transform 420ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .backdrop .map { position: absolute; inset: 0; }
  body[data-bg="map"] .backdrop .render { visibility: hidden; }
  body[data-bg="image"] .backdrop .map { visibility: hidden; }
  body.dragging .backdrop .render, body.drifting .backdrop .render { transition: none; }
  @property --grip-alpha { syntax: '<number>'; inherits: true; initial-value: 0.5; }
  .backdrop .mapboxgl-ctrl-bottom-right { right: 8px; bottom: 4px; }

  /* Input plane for the background: drag to pan, wheel or pinch to zoom, double-click to reset */
  #stage > .pan-plane { position: absolute; cursor: grab; touch-action: none; }
  body.dragging #stage > .pan-plane { cursor: grabbing; }

  /* Drag handle on the District IO card */
  /* The hot state is a body class (not :hover), so the Liquid DOM canvas copy shows it too */
  .grip {
    position: absolute;
    left: 50%;
    top: 0;
    z-index: 2;
    width: 96px;
    height: 20px;
    transform: translateX(-50%);
    cursor: grab;
    touch-action: none;
    outline: none;
  }
  .grip::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 3px;
    width: 40px;
    height: 16px;
    border-radius: 9999px;
    background: rgba(255, 255, 255, 0);
    transform: translateX(-50%);
    transition: background 160ms ease;
  }
  .grip::before {
    /* 3 x 2 dot grip */
    content: "";
    position: absolute;
    left: 50%;
    top: 5px;
    z-index: 1;
    width: 18px;
    height: 12px;
    transform: translateX(-50%);
    background-image: radial-gradient(circle at center, rgba(255, 255, 255, var(--grip-alpha, 0.5)) 1.5px, transparent 1.9px);
    background-size: 6px 6px;
    transition: --grip-alpha 160ms ease;
  }
  body.grip-hot .grip { --grip-alpha: 1; }
  body.grip-hot .grip::after { background: rgba(255, 255, 255, 0.14); }
  body.grip-focus .grip::after { box-shadow: 0 0 0 2px var(--white); }
  .grip-label {
    position: absolute;
    left: 50%;
    top: 22px;
    padding: 3px 8px;
    border-radius: 9999px;
    background: rgba(10, 12, 14, 0.72);
    color: var(--white);
    font-size: 12px;
    line-height: 16px;
    font-weight: 500;
    white-space: nowrap;
    text-shadow: none !important;
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -2px);
    transition: opacity 160ms ease, transform 160ms ease;
  }
  body:is(.grip-hot, .grip-focus):not(.card-lifted) .grip-label {
    opacity: 1;
    transform: translate(-50%, 0);
    transition-delay: 400ms;
  }
  body.dragging .grip, body.card-lifted .grip { cursor: grabbing; }

  /* Lift while the card moves (not in WebGL mode: a transform there misaligns the glass) */
  body:is(.bd, .gc) #stage > .panel[data-panel="card"],
  body:is(.bd) #stage > .lens.card-lens { transition: transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 180ms ease; }
  body.card-lifted:is(.bd, .gc) #stage > .panel[data-panel="card"] { transform: scale(1.02); box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35); }
  body.card-lifted.bd #stage > .lens.card-lens { transform: scale(1.02); }

  /* First-visit coachmark for the card handle */
  #coach {
    position: fixed;
    z-index: 40;
    display: none;
    align-items: center;
    gap: 12px;
    max-width: 280px;
    padding: 10px 10px 10px 14px;
    border-radius: 14px;
    background: rgba(10, 12, 14, 0.82);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12), 0 12px 32px rgba(0, 0, 0, 0.35);
    font-size: 13px;
    line-height: 18px;
    opacity: 0;
    transform: translateX(6px);
    transition: opacity 220ms ease, transform 220ms ease;
  }
  #coach.show { display: flex; }
  #coach.in { opacity: 1; transform: translateX(0); }
  #coach::after {
    /* arrow pointing right, at the handle */
    content: "";
    position: absolute;
    right: -6px;
    top: 18px;
    width: 12px;
    height: 12px;
    background: inherit;
    transform: rotate(45deg);
    box-shadow: inset -1px 1px 0 rgba(255, 255, 255, 0.12);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    background: rgba(10, 12, 14, 0.82);
  }
  #coach .dots {
    flex: none;
    width: 18px;
    height: 12px;
    background-image: radial-gradient(circle at center, #fff 1.5px, transparent 1.9px);
    background-size: 6px 6px;
  }
  #coach button { flex: none; padding: 5px 12px; border-radius: 9999px; background: var(--white); color: #000; font-size: 12px; font-weight: 600; }

  .backdrop .shadow, body.wg #stage > .shadow.wg-fill {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(5, 7, 9, 0.5) 0%, rgba(5, 7, 9, 0.3) 25%, rgba(5, 7, 9, 0) 50%),
      radial-gradient(50% 50% at 50% 50%, rgba(5, 7, 9, 0) 0%, rgba(5, 7, 9, 0.2) 48.272%, rgba(5, 7, 9, 0.75) 100%);
  }

  /* Panels: glass mode keeps content clear, the glass renders the surface */
  .panel { position: relative; overflow: hidden; border-radius: 20px; }
  body:is(.bd, .gc) .panel.is-hidden { display: none; }
  body:is(.bd, .gc) .press { transition: transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  body:is(.bd, .gc) .press:active { transform: scale(0.96); }

  /* SVG backdrop glass (rebane2001 gist): each lens runs an SVG filter on the backdrop behind it */
  body.bd .panel {
    background:
      linear-gradient(180deg, rgba(255, 255, 255, 0.056) 0%, rgba(217, 237, 245, 0.012) 42%, rgba(209, 235, 242, 0.032) 100%),
      linear-gradient(90deg, rgba(var(--glass-fill), var(--bd-tint, 0.12)) 0%, rgba(var(--glass-fill), var(--bd-tint, 0.12)) 100%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
  }
  /* glasscn refract (kostyniuk/glasscn-components, MIT): backdrop-filter on the panel itself,
     SDF bezel displacement map, light blur and saturation, iOS-style rim */
  body.gc .panel {
    background:
      linear-gradient(90deg, rgba(var(--glass-fill), var(--gc-tint, 0.12)) 0%, rgba(var(--glass-fill), var(--gc-tint, 0.12)) 100%);
  }
  .gc-rim {
    position: absolute;
    inset: 0;
    z-index: 3;
    border-radius: inherit;
    pointer-events: none;
    padding: var(--liquid-glass-rim-width, 0.5px);
    background:
      linear-gradient(to right, rgba(255, 255, 255, 0), var(--liquid-glass-rim-light, rgba(255, 255, 255, 0.25)) var(--liquid-glass-rim-fade, 18%), var(--liquid-glass-rim-light, rgba(255, 255, 255, 0.25)) calc(100% - var(--liquid-glass-rim-fade, 18%)), rgba(255, 255, 255, 0)),
      linear-gradient(to bottom, rgba(0, 0, 0, 0), var(--liquid-glass-rim-dark, rgba(0, 0, 0, 0.2)) var(--liquid-glass-rim-fade, 18%), var(--liquid-glass-rim-dark, rgba(0, 0, 0, 0.2)) calc(100% - var(--liquid-glass-rim-fade, 18%)), rgba(0, 0, 0, 0));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  }

  #stage > .lens {
    position: absolute;
    pointer-events: none;
    transform-origin: 50% 50%;
    transition: transform 180ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  #stage > .lens.pressed { transform: scale(0.96); }
  #stage > .lens.is-hidden { display: none; }
  /* WebGL glass (ybouane/liquidglass): the stage is laid out in screen px, not transformed,
     because the library measures boxes with getBoundingClientRect and offsetWidth together.
     Panel content keeps the 1920 x 1080 design size through CSS zoom. */
  body.wg #stage { transform: none !important; width: 100vw; height: 100vh; overflow: hidden; }
  body.wg #stage > .panel { z-index: 2; overflow: visible; background: none; box-shadow: none; }
  body.wg #stage > .panel > :not(canvas) { zoom: var(--wg-s, 1); }
  /* Tone fill: above the glass canvas (both z-index -1, the fill comes later in tree order), below the content */
  body.wg #stage > .panel::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    border-radius: inherit;
    background: rgba(var(--glass-fill), var(--wg-tint, 0.16));
    pointer-events: none;
  }
  body.wg #stage > .panel.is-hidden { display: none; }
  body.wg > .header { position: fixed; z-index: 3; zoom: var(--wg-s, 1); }
  /* The root only holds what the glass samples; input reaches the pan plane under it */
  body.wg #stage { pointer-events: none; }
  body.wg #stage > .panel { pointer-events: auto; }
  body.wg > .pan-plane { position: fixed; z-index: 0; cursor: grab; touch-action: none; }
  body.wg.dragging > .pan-plane { cursor: grabbing; }
  body.wg #stage > .wg-fill { position: absolute; inset: 0; width: 100%; height: 100%; }
  body.wg #stage > img.wg-fill { object-fit: cover; transform-origin: 50% 50%; transition: transform 420ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  body.wg.dragging #stage > img.wg-fill, body.wg.drifting #stage > img.wg-fill { transition: none; }
  body.wg[data-bg="map"] #stage > img.wg-fill { display: none; }
  body.wg[data-bg="image"] #stage > canvas.wg-mirror { display: none; }
  body.wg > .backdrop { position: fixed; inset: 0; width: 100vw; height: 100vh; }
  .wg-attrib { position: fixed; right: 8px; bottom: 4px; z-index: 30; }
  .wg-attrib .mapboxgl-ctrl-bottom-right { position: static; }
  body.wg #stage { z-index: 1; }

  #lens-defs { position: absolute; left: -9999px; top: -9999px; width: 0; height: 0; overflow: hidden; }

  .label-caps {
    font-weight: 700;
    font-size: 14px;
    line-height: 21px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-shadow: var(--ts-soft);
    white-space: nowrap;
  }
  .label-caps.inter { font-family: var(--font-inter); }
  .section-head { display: flex; gap: 8px; align-items: center; width: 100%; }
  .section-head .rule { flex: 1 0 0; height: 1px; background: var(--white); }
  .icon { position: relative; flex-shrink: 0; }
  .icon > img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; }

  /* Mode tabs */
  .tab {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    font-size: 16px;
    line-height: 24px;
    font-weight: 400;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
    border-radius: 20px;
  }
  .tab.on { font-weight: 600; background: rgba(var(--glass-fill), 0.1); }
  body:is(.bd, .gc) .panel[data-panel^="tab-"] { background: var(--surface-quiet); }
  body:is(.bd, .gc) .panel[data-panel^="tab-"].on { background: var(--surface-active); }
  body:is(.bd, .gc) .tab.on { background: none; }

  /* Timeline */
  .timeline { display: flex; align-items: center; width: 100%; height: 100%; padding: 12px 16px; gap: 8px; }
  .tl-step { display: flex; align-items: center; justify-content: center; padding: 8px; background: transparent; flex-shrink: 0; }
  .tl-step .icon { width: 20px; height: 20px; }
  .tl-body { flex: 1 0 0; min-width: 1px; display: flex; flex-direction: column; gap: 16px; }
  .tl-top { display: flex; align-items: center; justify-content: space-between; }
  .tl-year { font-size: 40px; line-height: 48px; letter-spacing: -1.5px; text-shadow: var(--ts-soft); white-space: nowrap; }
  .tl-state { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 16px; line-height: 24px; text-shadow: var(--ts-soft); }
  .tl-state::before { content: ""; width: 8px; height: 8px; border-radius: 9999px; background: var(--white); }
  .tl-track { position: relative; padding: 1px 0; }
  .tl-line { position: absolute; left: 0; right: 0; top: 50%; height: 2px; transform: translateY(-50%); background: var(--white); box-shadow: 0 0 12px rgba(0, 0, 0, 0.15); }
  .tl-dots { position: relative; display: flex; justify-content: space-between; padding-left: 8px; }
  .tl-dot { width: 8px; height: 8px; border-radius: 9999px; background: #eff6ff; box-shadow: 0 0 12px rgba(0, 0, 0, 0.15); }
  .tl-thumb {
    position: absolute;
    top: 50%;
    width: 14px;
    height: 14px;
    border-radius: 9999px;
    background: var(--white);
    box-shadow: 0 0 12px 0 var(--white), 0 0 36px 0 #000;
    transform: translateY(-50%);
    transition: left 320ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .tl-labels { display: flex; align-items: center; justify-content: space-between; text-shadow: var(--ts-soft); }
  .tl-label { flex: 1 0 0; min-width: 1px; font-size: 14px; line-height: 20px; text-align: left; }
  .tl-label:nth-child(3) { text-align: center; }
  .tl-label:nth-child(4) { text-align: right; }
  .tl-label:nth-child(5) { text-align: right; }
  .tl-label.on { flex: 0 0 52px; font-weight: 600; font-size: 18px; line-height: 27px; }

  /* Assets */
  .card-pad { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; width: 100%; height: 100%; padding: 24px; }
  .assets { display: flex; flex-direction: column; gap: 16px; width: 100%; filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.15)); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 8px;
    border: 1px solid var(--white-30);
    border-radius: 9999px;
    font-weight: 500;
    font-size: 14px;
    line-height: 20px;
    text-shadow: var(--ts-drop);
    white-space: nowrap;
    color: var(--white);
  }
  .chip .mask { width: 12px; height: 12px; background: currentColor; -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }
  .chip.on { background: var(--white); color: #000; }

  /* Areas of interest */
  .aoi-list { display: flex; flex-direction: column; gap: 12px; width: 100%; }
  .aoi-row { display: flex; gap: 8px; align-items: flex-start; width: 100%; text-align: left; }
  .aoi-badge-icon { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; padding: 6px; border: 1px solid var(--white-20); border-radius: 9999px; flex-shrink: 0; }
  .aoi-badge-icon .icon { width: 20px; height: 20px; }
  .aoi-badge-icon .icon > img { position: absolute; width: auto; height: auto; }
  .aoi-text { flex: 1 0 0; min-width: 1px; display: flex; flex-direction: column; gap: 4px; text-shadow: var(--ts-drop); }
  .aoi-title-wrap { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .aoi-title { font-weight: 500; font-size: 18px; line-height: 27px; }
  .aoi-status { font-weight: 700; font-size: 14px; line-height: 20px; }
  .aoi-sub { font-size: 14px; line-height: 20px; }
  .badge { display: inline-flex; align-items: center; justify-content: center; padding: 4px 12px; border-radius: 9999px; font-size: 14px; line-height: 20px; white-space: nowrap; }
  .badge.outline { background: var(--white-10); border: 1px solid var(--white-50); font-weight: 700; text-shadow: 0 0 4px rgba(0, 0, 0, 0.25); }
  .badge.solid { background: var(--secondary); color: var(--secondary-fg); font-weight: 500; text-shadow: none; }
  .badge.tint { background: var(--white-10); font-weight: 700; text-shadow: 0 0 4px rgba(0, 0, 0, 0.25); }
  .rule-30 { height: 1px; width: 100%; background: var(--white-30); flex-shrink: 0; }

  /* Detail card */
  .detail { display: flex; flex-direction: column; gap: 8px; width: 100%; height: 100%; padding: 24px; }
  .detail-body { flex: 1 0 0; min-height: 1px; overflow: hidden; display: flex; flex-direction: column; gap: 24px; }
  .detail-head { display: flex; align-items: flex-start; justify-content: space-between; }
  .detail-titles { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
  .detail-title { font-size: 40px; line-height: 48px; letter-spacing: -1.5px; text-shadow: var(--ts-soft); }
  .close-btn { display: flex; align-items: center; justify-content: center; padding: 12px; border-radius: 9999px; background: var(--surface); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14), inset 0 0 0 1px rgba(255, 255, 255, 0.06); }
  .close-btn .icon { width: 24px; height: 24px; }
  .rule-full { height: 1px; width: 100%; background: var(--white); flex-shrink: 0; }
  .media { display: flex; flex-direction: column; gap: 12px; }
  .hero { width: 100%; aspect-ratio: 160 / 90; border-radius: 4px; object-fit: cover; }
  .thumbs { display: flex; gap: 8px; align-items: center; }
  .thumbs-nav { display: flex; align-items: center; justify-content: center; padding: 4px; background: var(--black-30); flex-shrink: 0; }
  .thumbs-nav.left { border-radius: 4px 0 0 4px; }
  .thumbs-nav.right { border-radius: 0 4px 4px 0; }
  .thumbs-nav .icon { width: 24px; height: 24px; }
  .thumb-row { flex: 1 0 0; min-width: 1px; display: flex; gap: 8px; }
  .thumb { flex: 1 0 0; min-width: 1px; aspect-ratio: 160 / 90; border-radius: 2px; overflow: hidden; outline: 1px solid transparent; outline-offset: 1px; }
  .thumb.on { outline-color: var(--white-50); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .desc {
    font-size: 16px;
    line-height: 24px;
    text-shadow: 0 0 12px #000;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  /* stretch: both buttons always take the height of the taller one */
  .actions { display: flex; gap: 8px; align-items: stretch; }
  .btn { display: flex; align-items: center; justify-content: center; min-height: 36px; padding: 8px 16px; border-radius: 9999px; font-weight: 500; font-size: 14px; line-height: 20px; white-space: nowrap; }
  /* Both buttons are 36 px. The dark one gets a hairline edge, so its full height reads against dark glass. */
  .actions .btn { height: auto; min-height: 36px; align-self: stretch; }
  .btn.dark { background: var(--black-50); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.16), 0 1px 2px rgba(0, 0, 0, 0.05); }
  .btn.light { flex: 1 0 0; background: var(--secondary); color: var(--secondary-fg); }

  /* Map controls */
  .ctrl { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; border-radius: 20px; }
  .ctrl .icon { width: 24px; height: 24px; }
  .ctrl.on { background: rgba(var(--glass-fill), 0.14); }
  .ctrl.pin .inner { display: flex; align-items: center; justify-content: center; padding: 12px; width: 100%; background: var(--black-10); }

  /* KPI band */
  .band { width: 100%; height: 100%; padding: 24px; }
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 80px; gap: 8px; height: 100%; }
  .kpi { display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 4px 0; text-shadow: var(--ts-soft); }
  .kpi-value { display: flex; align-items: flex-end; gap: 4px; }
  .kpi-num { font-weight: 600; font-size: 24px; line-height: 28.8px; letter-spacing: -1px; white-space: nowrap; }
  .kpi-unit { font-weight: 500; font-size: 14px; line-height: 20px; }

  /* Videos */
  .videos { display: flex; flex-direction: column; gap: 16px; filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.15)); }
  .count { font-size: 14px; line-height: 21px; letter-spacing: 1.5px; text-shadow: var(--ts-soft); }
  .arrows { display: flex; gap: 1px; border-radius: 8px; overflow: hidden; }
  .arrows button { display: flex; padding: 4px; }
  .arrows .icon { width: 16px; height: 16px; }
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tile { position: relative; display: flex; aspect-ratio: 140 / 79; border-radius: 4px; overflow: hidden; box-shadow: 0 0 12px rgba(0, 0, 0, 0.15); }
  .tile > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.6) 100%); }
  .tile-left { position: relative; z-index: 1; flex: 1 0 0; min-width: 1px; display: flex; align-items: flex-end; padding: 4px; }
  .tile-title { font-weight: 700; font-size: 10px; line-height: 1.5; text-shadow: var(--ts-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile-right { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; width: 24px; }
  .tile-right span { display: flex; align-items: center; justify-content: center; min-width: 24px; min-height: 24px; padding: 4px; }
  .tile-right .icon { width: 16px; height: 16px; }
  .tile .play { position: absolute; z-index: 1; left: 50%; top: calc(50% - 0.5px); width: 20px; height: 24px; transform: translate(-50%, -50%); }

  /* Header */
  .header { position: relative; display: flex; align-items: center; justify-content: space-between; width: var(--w); height: 72px; padding: 16px 24px; }
  .header > .bar-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
  .h-left, .h-right { position: relative; display: flex; align-items: center; gap: 16px; width: 678px; }
  .h-right { justify-content: flex-end; align-self: stretch; }
  .dso-logo { position: relative; width: 103px; height: 38px; }
  .dso-logo img { position: absolute; top: -31.58%; bottom: -31.58%; left: 0; right: 0; width: 100%; height: auto; }
  .compass { position: relative; width: 516px; height: 40px; }
  .compass .union { position: absolute; left: 0.1%; right: 0.1%; top: 50%; aspect-ratio: 515 / 40; transform: translateY(-50%); }
  .compass .union img { position: absolute; top: -20%; right: -2.33%; bottom: -30%; left: -1.55%; width: 103.88%; height: 150%; max-width: none; }
  .mark { position: absolute; top: 3.15px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .mark .tick { display: flex; align-items: center; justify-content: center; width: 0; height: 4px; }
  .mark .tick > span { position: relative; display: block; width: 4px; height: 0; transform: rotate(90deg); flex: none; }
  .mark .tick img { position: absolute; top: -0.5px; bottom: -1.5px; left: -12.52%; right: -12.52%; width: 125.04%; height: 2px; max-width: none; }
  .mark p { font-family: var(--font-compass); font-weight: 700; font-size: 16px; line-height: 1.2; text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.8); white-space: nowrap; }
  .vsep { width: 1px; align-self: stretch; background: var(--white-50); opacity: 0.5; margin: 0 2px; }
  .clock { display: flex; flex-direction: column; gap: 2px; text-shadow: var(--ts-soft); white-space: nowrap; }
  .clock .t { font-weight: 500; font-size: 14px; line-height: 20px; color: #fafafa; }
  .clock .d { font-size: 12px; line-height: 16px; }
  .avatar { display: flex; align-items: center; gap: 8px; }
  .avatar .dot { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 9999px; background: var(--secondary); color: #0a0a0a; font-weight: 600; font-size: 14px; line-height: 20px; }
  .avatar .icon { width: 16px; height: 16px; }
  .dio-logo { height: 38px; aspect-ratio: 3760 / 2303; object-fit: cover; }

  /* Fallback notice and tuning panel (outside the canvas) */
  #notice {
    position: fixed;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    z-index: 20;
    display: none;
    align-items: center;
    gap: 12px;
    max-width: calc(100vw - 32px);
    padding: 10px 12px 10px 16px;
    border-radius: 9999px;
    background: rgba(10, 12, 14, 0.78);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    font-size: 13px;
    line-height: 18px;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
  }
  #notice code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  #notice button { padding: 4px 10px; border-radius: 9999px; background: var(--white-10); font-size: 12px; }
  body.show-notice #notice { display: flex; }

  /* Light glass base: white fill, and a stronger text shadow so white text stays readable */
  body[data-tone="light"] { --glass-fill: 255, 255, 255; }
  body[data-tone="light"] .panel :where(p, span, button, a) { text-shadow: 0 1px 4px rgba(0, 0, 0, 0.45) !important; }
  body[data-tone="light"] .panel :is(.btn.light, .chip.on, .badge.solid) { text-shadow: none !important; }

  /* Render mode switch: sits in the empty strip between the header and the panels */
  #modes {
    position: fixed;
    z-index: 25;
    left: 0;
    top: 0;
    display: flex;
    gap: 2px;
    padding: 3px;
    border-radius: 9999px;
    background: rgba(10, 12, 14, 0.55);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    transform-origin: 50% 0;
  }
  #modes button {
    padding: 4px 12px;
    border-radius: 9999px;
    font-size: 12px;
    line-height: 16px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.78);
    white-space: nowrap;
  }
  #modes button:hover { color: var(--white); }
  #modes button.on { background: var(--white); color: #000; }
  #modes button.na { opacity: 0.45; }
  #modes kbd { font-family: inherit; opacity: 0.55; margin-right: 4px; }
  #modes .sep { width: 1px; margin: 4px 4px; background: rgba(255, 255, 255, 0.2); }
  /* Portrait: Mapbox logo and attribution sit in the visible map area, not under the bottom sheet */
  body.mobile .backdrop .mapboxgl-ctrl-bottom-right { top: 38%; bottom: auto; }
  body.mobile .wg-attrib { top: 38%; bottom: auto; }

  /* ---------- Adjust panel: optics sliders for the active mode and tone ---------- */
  #tune {
    position: fixed;
    left: 50%;
    top: var(--tune-top, 110px);
    z-index: 35;
    display: none;
    width: min(860px, calc(100vw - 32px));
    max-height: calc(100vh - var(--tune-top, 110px) - 16px);
    overflow: auto;
    padding: 18px 24px 20px;
    border-radius: 16px;
    background: rgba(18, 18, 22, 0.96);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 24px 64px rgba(0, 0, 0, 0.5);
    transform: translateX(-50%);
    color: #e4e4e7;
    font-size: 13px;
    line-height: 18px;
    overscroll-behavior: contain;
  }
  body.show-tune #tune { display: block; }
  #tune .tune-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  #tune .tune-title { font-size: 14px; font-weight: 600; color: #fafafa; }
  #tune .tune-sub { color: #a1a1aa; font-weight: 400; }
  #tune .tune-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  #tune .tune-actions button {
    padding: 6px 12px;
    border-radius: 9999px;
    background: rgba(255, 255, 255, 0.08);
    color: #e4e4e7;
    font-size: 12px;
    font-weight: 500;
    line-height: 16px;
  }
  #tune .tune-actions button:hover { background: rgba(255, 255, 255, 0.14); }
  #tune .tune-actions [data-t="close"] { width: 28px; padding: 6px 0; font-size: 14px; }
  #tune .tune-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 48px; row-gap: 8px; }
  #tune .tune-row { display: grid; grid-template-columns: 132px minmax(0, 1fr) 52px; align-items: center; gap: 16px; min-height: 28px; }
  #tune .tune-row span { color: #a1a1aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #tune .tune-row output { text-align: right; color: #e4e4e7; font-variant-numeric: tabular-nums; }
  #tune input[type="range"] {
    --p: 50%;
    width: 100%;
    height: 22px;
    margin: 0;
    background: transparent;
    -webkit-appearance: none;
    appearance: none;
    cursor: pointer;
  }
  #tune input[type="range"]::-webkit-slider-runnable-track {
    height: 6px;
    border-radius: 9999px;
    background: linear-gradient(to right, #a29bfe 0 var(--p), #2e2e36 var(--p) 100%);
  }
  #tune input[type="range"]::-moz-range-track { height: 6px; border-radius: 9999px; background: #2e2e36; }
  #tune input[type="range"]::-moz-range-progress { height: 6px; border-radius: 9999px; background: #a29bfe; }
  #tune input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    margin-top: -5px;
    border-radius: 9999px;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
  }
  #tune input[type="range"]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 9999px; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4); }
  #tune input[type="range"]:focus-visible { outline: none; }
  #tune input[type="range"]:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px rgba(162, 155, 254, 0.6); }
  #tune input[type="range"]:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 3px rgba(162, 155, 254, 0.6); }
  #tune .tune-note { margin-top: 12px; color: #71717a; font-size: 12px; }
  body.mobile #tune {
    left: 0;
    right: 0;
    top: auto;
    bottom: 0;
    width: auto;
    max-height: 62vh;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    border-radius: 20px 20px 0 0;
    transform: none;
  }
  body.mobile #tune .tune-head { flex-wrap: wrap; }
  body.mobile #tune .tune-grid { grid-template-columns: minmax(0, 1fr); }
  body.mobile #tune .tune-row { grid-template-columns: 112px minmax(0, 1fr) 44px; gap: 12px; }

  /* ---------- Performance HUD (?fps or key F) ---------- */
  /* Floats under the top bar, like the Adjust panel. With both open: Adjust left, FPS right. */
  #perf {
    position: fixed;
    left: 50%;
    top: var(--tune-top, 110px);
    z-index: 45;
    display: none;
    width: 360px;
    max-height: calc(100vh - var(--tune-top, 110px) - 16px);
    overflow: auto;
    padding: 14px 16px;
    border-radius: 16px;
    background: rgba(18, 18, 22, 0.96);
    -webkit-backdrop-filter: blur(16px);
    backdrop-filter: blur(16px);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 24px 64px rgba(0, 0, 0, 0.5);
    transform: translateX(-50%);
    color: #e4e4e7;
    font-size: 13px;
    line-height: 18px;
    font-variant-numeric: tabular-nums;
  }
  body.show-perf.show-tune #perf { left: auto; right: 16px; transform: none; }
  body.show-perf.show-tune #tune { left: 16px; transform: none; width: min(860px, calc(100vw - 360px - 48px)); }
  #perf .verdict { padding: 2px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; background: rgba(74, 222, 128, 0.16); color: #86efac; }
  #perf .verdict.warn { background: rgba(251, 191, 36, 0.16); color: #fcd34d; }
  #perf .verdict.bad { background: rgba(248, 113, 113, 0.16); color: #fca5a5; }
  #perf .cap { color: #71717a; font-size: 12px; }
  #perf details { margin-top: 6px; color: #a1a1aa; }
  #perf summary { cursor: pointer; font-size: 12px; }
  #perf .bench-title { font-weight: 600; color: #fafafa; margin-bottom: 4px; }
  #perf .bench-say { margin-top: 6px; color: #e4e4e7; }
  body.show-perf #perf { display: block; }
  #perf .fps { font-size: 26px; line-height: 30px; font-weight: 600; color: #fff; }
  #perf .fps.warn { color: #fbbf24; }
  #perf .fps.bad { color: #f87171; }
  #perf .row { display: flex; justify-content: space-between; gap: 8px; }
  #perf .row span:first-child { color: #a1a1aa; }
  #perf .graph { display: block; width: 100%; height: 36px; margin: 6px 0; }
  #perf .dim { color: #71717a; }
  #perf .bench { margin-top: 8px; border-top: 1px solid rgba(255, 255, 255, 0.1); padding-top: 8px; }
  #perf table { width: 100%; border-collapse: collapse; }
  #perf td, #perf th { padding: 1px 0; text-align: right; font-weight: 400; }
  #perf td:first-child, #perf th:first-child { text-align: left; color: #a1a1aa; }
  #perf .btns { display: flex; gap: 6px; margin-top: 8px; }
  #perf .btns button { flex: 1; padding: 7px 0; border-radius: 9999px; background: rgba(255, 255, 255, 0.1); font: 500 12px/16px var(--font); color: #fff; }
  #perf .btns button[data-perf-act="bench"] { background: #fff; color: #000; }
  #perf .btns button:disabled { opacity: 0.4; }
  body.mobile #perf { left: 8px; right: 8px; top: calc(env(safe-area-inset-top, 0px) + 8px); width: auto; transform: none; }

  /* Glass off (benchmark comparison): panels keep their tint, only the glass effect stops */
  body.glass-off.wg #stage > .panel > canvas { visibility: hidden; }
  body.glass-off.bd #stage > .lens { display: none; }
  body.glass-off.gc #stage > .panel { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }

  /* ---------- Portrait layout (phones): 430 px wide design frame, height follows the screen ---------- */
  body.mobile { --w: 430px; }
  body.mobile .header { height: 56px; padding: 8px 16px; }
  body.mobile .header .compass, body.mobile .header .clock, body.mobile .header .vsep, body.mobile .header .dio-logo { display: none; }
  body.mobile .h-left, body.mobile .h-right { width: auto; }
  body.mobile .grip { display: none; }
  body.mobile .tab { font-size: 15px; }
  body.mobile .timeline { padding: 12px 8px; }
  body.mobile .card-pad { justify-content: flex-start; overflow-y: auto; padding: 16px; }
  body.mobile .detail { display: block; overflow-y: auto; padding: 16px; }
  body.mobile .detail-body { overflow: visible; }
  body.mobile .detail .actions { margin-top: 16px; }
  body.mobile .desc { display: block; -webkit-line-clamp: unset; overflow: visible; }
  body.mobile .band { padding: 16px; overflow-y: auto; }
  body.mobile .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 72px; height: auto; }
  body.mobile .tiles { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 72%; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; }
  body.mobile .tile { scroll-snap-align: start; }
  body.mobile .ctrl .icon { width: 22px; height: 22px; }

  /* Bottom sheet segments */
  .seg { display: flex; gap: 4px; width: 100%; height: 100%; padding: 4px; }
  .seg button {
    flex: 1 1 0;
    min-width: 0;
    border-radius: 16px;
    font-size: 13px;
    line-height: 16px;
    font-weight: 500;
    white-space: nowrap;
    text-shadow: var(--ts-soft);
  }
  .seg button.on { background: var(--white); color: #000; text-shadow: none; }

  /* Settings sheet: the mode, background and tone switch */
  body.mobile #modes { display: none; flex-wrap: wrap; justify-content: center; row-gap: 4px; border-radius: 20px; padding: 6px; }
  body.mobile.show-modes #modes { display: flex; }
  body.mobile #modes button { font-size: 13px; line-height: 18px; padding: 7px 12px; }
  body.mobile #modes .sep, body.mobile #modes kbd { display: none; }
  #modes button:disabled { opacity: 0.35; cursor: not-allowed; }

  @media (prefers-reduced-motion: reduce) {
    .backdrop .render, .tl-thumb, body:is(.bd, .gc) .press, #stage > .lens { transition: none; }
    #coach, .grip-label, .grip::after { transition: none; }
  }
</style>
</head>
<body>

<div id="stage" aria-label="DSO digital twin demo"></div>
<div id="safe-probe" aria-hidden="true"></div>

<div id="notice" role="status">
  <span data-ref="notice-text"></span>
  <button type="button" data-action="dismiss-notice">OK</button>
</div>

<div id="modes" role="group" aria-label="Glass renderer">

  <button type="button" data-mode="webgl"><kbd>3</kbd>WebGL glass</button>
  <button type="button" data-mode="glasscn"><kbd>4</kbd>glasscn</button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" data-bg="map"><kbd>M</kbd>Map</button>
  <button type="button" data-bg="image"><kbd>I</kbd>Image</button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" data-tone="dark"><kbd>D</kbd>Dark</button>
  <button type="button" data-tone="light"><kbd>L</kbd>Light</button>

  <button type="button" data-adjust aria-expanded="false" aria-controls="tune"><kbd>A</kbd>Adjust</button>

</div>

<div id="lens-defs" aria-hidden="true"></div>

<div id="tune" role="dialog" aria-label="Adjust glass"></div>

<div id="perf" role="status" aria-label="Performance"></div>

<template id="ui">

      <div class="mark" style="left: 117.41px"><span class="tick"><span><img src="assets/compass/tick.svg" alt=""></span></span><p>195</p><span class="tick"><span><img src="assets/compass/tick.svg" alt=""></span></span></div>
      <div class="mark" style="left: 404.33px"><span class="tick"><span><img src="assets/compass/tick.svg" alt=""></span></span><p>210</p><span class="tick"><span><img src="assets/compass/tick.svg" alt=""></span></span></div>
    </div>

      <span class="vsep"></span>

  <!-- Mode tabs -->
